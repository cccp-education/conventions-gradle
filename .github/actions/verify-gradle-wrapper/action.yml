name: Verify Gradle wrapper
description: >-
  Fails when any gradle/wrapper/gradle-wrapper.properties of the repository
  does not match the workspace Gradle version (single source of truth,
  CNV-13.6). Reusable by any repository:
  `uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main`.
author: cccp-education

inputs:
  expected-version:
    description: Expected Gradle distribution version
    required: false
    default: "9.8.2"
  wrapper-path:
    description: >-
      Explicit gradle-wrapper.properties path. When empty (default), every
      wrapper found in the repository is verified (multi-module repositories).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check the wrapper distribution version
      shell: bash
      run: |
        set -euo pipefail
        explicit="${{ inputs.wrapper-path }}"
        expected="${{ inputs.expected-version }}"

        if [ -n "$explicit" ] && [ -f "$explicit" ]; then
          files="$explicit"
        else
          # Discovery mode: verify every wrapper of the repository. A repository
          # whose Gradle build lives in a sub-directory (e.g. `*-plugin/`) has
          # no root wrapper, so a fixed default path would produce a false red.
          files=$(find . -name gradle-wrapper.properties \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/node_modules/*' \
            -not -path './.git/*')
        fi

        if [ -z "$files" ]; then
          echo "::error::No gradle-wrapper.properties found (workspace requires Gradle $expected)"
          exit 1
        fi

        failed=0
        checked=0
        last=""
        for file in $files; do
          checked=$((checked + 1))
          # No pipe: a `sed | head` under pipefail dies with SIGPIPE (lesson S-318).
          actual=$(sed -nE 's/.*gradle-([0-9]+\.[0-9]+(\.[0-9]+)?)-(bin|all)\.zip.*/\1/p' "$file")
          if [ "$actual" != "$expected" ]; then
            echo "::error::'$file' declares Gradle '$actual' but the workspace requires $expected — run ./gradlew wrapper --gradle-version $expected"
            failed=1
          else
            last="$actual"
          fi
        done

        [ "$failed" -eq 0 ] || exit 1
        echo "Gradle wrapper OK: $checked file(s) at $last"
