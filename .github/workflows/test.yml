name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: Build & Test (UT + Functional + Cucumber)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: cccpeducation/cccp-ci-base@sha256:4722c1bcc71c0343c05257842b774715fc2574ff79182599a29fe8c1361cbeb3

    steps:
      - uses: actions/checkout@v5

      - name: Verify the Gradle wrapper version
        uses: ./.github/actions/verify-gradle-wrapper
        with:
          wrapper-path: conventions-plugin/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # GBL-013 US-4 — the adapter carries no logic: the runtime image provides
      # JDK 25 (no setup-java) and `ci/run.sh test` runs the build (S-341 contract).
      - name: Build and Test
        run: ci/run.sh test
